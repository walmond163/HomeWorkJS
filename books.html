<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя библиотека</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="iphone-screen">
        
        <h2>Моя библиотека</h2>
        
        <button id="addBook">Добавить книгу</button>
        <dialog id="addModal">
            <form id="bookForm">
                <input type="text" id="title" placeholder="Название">
                <input type="text" id="author" placeholder="Автор">
                <input type="number" id="year" placeholder="Год">
                <input type="text" id="genre" placeholder="Жанр">
                <button type="button" id="btnAdd">Добавить</button>
                <button type="button" id="btnClose">Закрыть</button>
            </form>
        </dialog>
        
        <button id="seaBook">Посмотреть список книг</button>
        <dialog id="seaBooks">
            <input id="search" placeholder="поиск...">
            <ul id="taskList"></ul>
            <ol id="finded"></ol>
            <button type="button" id="btn-Close">Закрыть</button>
        </dialog>
        
        <div class="home-indicator"></div>
    </div>
    
    <script src="books.js"></script>
</body>
</html>
